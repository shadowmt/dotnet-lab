# 学習用。平文 Secret を Git 管理しているのはクラスタが手元ローカル限定のため。
# 本番では ExternalSecrets / SealedSecrets 等に置き換える前提。
apiVersion: v1
kind: Secret
metadata:
  name: notes-api-config
type: Opaque
stringData:
  # API が GetConnectionString("NotesDb") として読む値（env 名は __ でセクション区切り）
  CONNECTIONSTRINGS__NOTESDB: "Host=notes-db;Port=5432;Database=notesdb;Username=notes;Password=notes-local-dev"
  # postgres コンテナの初期化パスワード（上記接続文字列の Password と同一値）
  POSTGRES_PASSWORD: "notes-local-dev"
