# ArgoCD Application CR（Phase 4 で作成、Phase 5 で auto-sync 有効化）。作成は宣言的 kubectl apply のみ（argocd CLI は使わない）。
# Phase 5 より同期は自動化（syncPolicy.automated）。手動同期（REST API / UI）は不要になる。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shadowmt/dotnet-lab.git
    targetRevision: main
    path: k8s/base
  destination:
    # minikube in-cluster の公式既定アドレス。追加のクラスタ登録は不要
    server: https://kubernetes.default.svc
    namespace: notes
  # Phase 5 より auto-sync 有効化。prune: true で Git から消えたリソースを同期時に削除し、selfHeal: true でクラスタ側の手動変更を Git の状態へ自動復元する。
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
