name: test

on:
  push:
  pull_request:

# packages: write is required for build-push to push images to ghcr.io.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run integration tests
        run: dotnet test NotesApi.Tests/NotesApi.Tests.csproj --nologo

  build-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Export short SHA
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Build image
        env:
          IMAGE: ghcr.io/shadowmt/notes-api:${{ env.SHORT_SHA }}
        run: docker build -t "$IMAGE" NotesApi

      - name: Push image
        env:
          IMAGE: ghcr.io/shadowmt/notes-api:${{ env.SHORT_SHA }}
        run: docker push "$IMAGE"

  # build-push 後のタグ書き戻し工程: ghcr.io のイメージタグを kustomization に反映して main へ push し直す（ArgoCD の auto-sync が拾う）。GITHUB_TOKEN による push は GitHub 公式仕様でワークフローを再発動しないうえ、コミットメッセージの [skip ci] も第 2 の保険として効くため CI ループは起きない。
  update-tag:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Export short SHA
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Update image tag and push back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41176060+github-actions[bot]@users.noreply.github.com"
          cd k8s/base
          kustomize edit set image notes-api=ghcr.io/shadowmt/notes-api:${SHORT_SHA}
          cd ../..
          git diff --quiet -- k8s/base/kustomization.yaml && echo "no tag change" || { git add k8s/base/kustomization.yaml && git commit -m "ci: update notes-api image tag to ${SHORT_SHA} (auto) [skip ci]" && git push origin HEAD:main; }
