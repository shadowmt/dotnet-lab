name: test

on:
  push:
  pull_request:

# packages: write is required for build-push to push images to ghcr.io.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run integration tests
        run: dotnet test NotesApi.Tests/NotesApi.Tests.csproj --nologo

  build-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Export short SHA
        run: echo "SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_ENV"

      - name: Build image
        env:
          IMAGE: ghcr.io/shadowmt/notes-api:${{ env.SHORT_SHA }}
        run: docker build -t "$IMAGE" NotesApi

      - name: Push image
        env:
          IMAGE: ghcr.io/shadowmt/notes-api:${{ env.SHORT_SHA }}
        run: docker push "$IMAGE"
